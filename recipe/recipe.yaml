schema_version: 1

context:
  name: mscxyz
  version: "4.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: e4ca06f2cc8919a0fec1f7a5e06359886c22c14bb8f0d2601ba738b9d5953069

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - musescore-manager=mscxyz.cli:execute

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - uv-build >=0.10.4,<0.11.0
  run:
    - python >=${{ python_min }}
    - lxml >=6.0.2
    - termcolor >=3.3.0
    - tmep >=4.0.0
    - lxml-stubs >=0.5.1
    - shtab >=1.8.0

tests:
  - python:
      imports:
        - mscxyz
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - musescore-manager -h

about:
  license: MIT
  license_file: LICENSE
  summary: A command line tool to manipulate the XML based *.mscX and *.mscZ files of the notation software MuseScore.
  description: |
    Manipulate the XML based mscx files of the notation software MuseScore.
  homepage: https://github.com/Josef-Friedrich/mscxyz
  repository: https://github.com/Josef-Friedrich/mscxyz
  documentation: https://mscxyz.readthedocs.io/

extra:
  recipe-maintainers:
    - thewchan
